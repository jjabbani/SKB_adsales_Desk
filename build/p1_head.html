<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광고영업팀 매출관리 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --line:#e2e6ee; --line2:#eef1f6;
  --text:#1b2230; --muted:#6b7688; --brand:#1f5fd6; --brand-soft:#eaf1fd;
  /* 시리즈 색 — 수주=slot1 blue, 제안=slot2 orange (CVD 검증 통과) */
  --win:#1f5fd6;  --win-mark:#2a78d6;  --win-soft:#eaf1fd;
  --prop:#b04a1c; --prop-mark:#eb6834; --prop-soft:#fdeee7;
  --danger:#c33; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;font-variant-numeric:tabular-nums}
a{color:var(--brand)}
.hide{display:none !important}

/* ---------- 공통 컨트롤 ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--text);
  padding:7px 13px;border-radius:8px;font-weight:600;white-space:nowrap}
.btn:hover{background:#f7f9fc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a52bb}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.btn.ghost:hover{background:#eef1f6;color:var(--text)}
.btn.danger{border-color:#f0c7c7;color:var(--danger);background:#fff}
.btn.danger:hover{background:#fdf2f2}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fld{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.lb{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.req::after{content:" *";color:var(--danger)}

/* ---------- 로그인 ---------- */
#authView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:28px 26px;box-shadow:0 6px 24px rgba(20,30,60,.06)}
.auth-card h1{font-size:19px;margin:0 0 4px}
.auth-card .sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}
.auth-card .row{margin-bottom:12px}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px}
.auth-tabs button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:600;color:var(--muted)}
.auth-tabs button.on{background:var(--brand-soft);border-color:#bcd3f7;color:var(--brand)}
.msg{font-size:12.5px;margin-top:10px;min-height:17px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--win)}

/* ---------- 헤더 ---------- */
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1680px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--brand)}
.years{display:flex;gap:4px;background:#f1f4f9;padding:3px;border-radius:9px}
.years button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:700;color:var(--muted)}
.years button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{display:flex;gap:2px;margin-left:6px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--brand-soft);color:var(--brand)}
.tabs button.quick{background:var(--brand);color:#fff;font-weight:700;margin-left:4px}
.tabs button.quick:hover{background:#1a52bb}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.who{font-size:12.5px;color:var(--muted)}
.who b{color:var(--text)}
.badge-lead{background:#fff3e0;color:#a8620a;border:1px solid #f3ddb9;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:4px}

/* ---------- 레이아웃 ---------- */
main{max-width:1680px;margin:0 auto;padding:16px 18px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:14px;margin:0;font-weight:700}
.card-h .spacer{margin-left:auto}
.card-b{padding:14px 16px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.kpi .t{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:-.2px}
.kpi .v{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.6px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.win .v{color:var(--win)}
.kpi.prop .v{color:var(--prop)}

/* ---------- 표 ---------- */
.tbl-wrap{overflow:auto;max-height:64vh;border-top:1px solid var(--line2)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;white-space:nowrap}
table.grid th,table.grid td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left}
table.grid thead th{position:sticky;top:0;background:#f7f9fc;z-index:2;font-size:11.5px;color:var(--muted);
  font-weight:700;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
table.grid thead th.nos{cursor:default}
table.grid tbody tr:hover{background:#fafcff}
table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid td.mine{}
/* 긴 텍스트 열 — 10자 넘으면 …으로 줄이고 마우스를 올리면 전체가 보입니다 */
table.grid td.clip{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid th.clip{max-width:150px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pill.수주{background:var(--win-soft);color:var(--win)}
.pill.제안{background:var(--prop-soft);color:var(--prop)}
.tbl-foot{padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tbl-foot .spacer{margin-left:auto}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- 검색/필터 ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.filters .wide{grid-column:span 2}
@media(max-width:700px){.filters .wide{grid-column:span 1}}

/* ---------- 모달 ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(18,24,38,.42);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 18px 50px rgba(15,25,50,.22)}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.modal-h h3{margin:0;font-size:15.5px}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px}
.modal-f{padding:13px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.modal-f .spacer{margin-left:auto}
.frm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.frm .c2{grid-column:span 2}
.frm .c3{grid-column:span 3}
@media(max-width:640px){.frm{grid-template-columns:1fr}.frm .c2,.frm .c3{grid-column:span 1}}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- 차트 ---------- */
.chart{width:100%;height:260px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- 업로드 ---------- */
.drop{border:2px dashed #c9d4e6;border-radius:12px;padding:26px;text-align:center;color:var(--muted);background:#fbfcfe}
.drop.on{border-color:var(--brand);background:var(--brand-soft)}
.prev-tbl{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1b2230;color:#fff;
  padding:10px 18px;border-radius:9px;font-size:13px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ---------- 설정 탭 ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.set-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column}
.set-card .h{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.set-card .h b{font-size:13.5px}
.set-card .h .cnt{margin-left:auto;font-size:11.5px;color:var(--muted)}
.set-list{padding:6px 8px;max-height:280px;overflow:auto}
.set-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px}
.set-item:hover{background:#f7f9fc}
.set-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-item input.ed{flex:1;padding:4px 7px;border:1px solid var(--brand);border-radius:6px}
.set-add{padding:9px 12px;border-top:1px solid var(--line2);display:flex;gap:6px}
.set-add input{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:7px}
/* ---------- 상위 10 막대 ---------- */
.mini{height:4px;background:#eef1f6;border-radius:3px;margin-top:5px;width:100%}
.mini i{display:block;height:100%;background:var(--win-mark);border-radius:3px}
.rank{color:var(--muted);font-size:11.5px;width:22px}

.dchip{display:inline-flex;align-items:center;gap:5px;background:#f4f6fa;border:1px solid var(--line);
  border-radius:20px;padding:3px 5px 3px 11px;font-size:12px;margin:0 5px 5px 0}
.dchip button{border:0;background:var(--brand-soft);color:var(--brand);border-radius:14px;
  padding:2px 8px;font-size:11px;font-weight:700}
.dchip button:hover{background:#d9e6fb}

.role-note{font-size:12.5px;color:var(--muted);background:#f7f9fc;border:1px solid var(--line2);
  border-radius:8px;padding:10px 13px;margin-bottom:14px}

/* ---------- 피벗(수주 분석) ---------- */
.pivot-wrap{overflow:auto;max-height:70vh}
table.grid td.dim{position:sticky;left:0;background:#fff;font-weight:700;z-index:1;border-right:1px solid var(--line2)}
table.grid tbody tr:hover td.dim{background:#fafcff}
table.grid thead th.dim{left:0;z-index:3;background:#f7f9fc;border-right:1px solid var(--line)}
table.grid tr.tot td{background:#f7f9fc;font-weight:800;border-top:1px solid var(--line)}
table.grid tr.tot td.dim{background:#f7f9fc}
.heat{position:relative}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.yadd{border:1px dashed #c2cddd;background:transparent;color:var(--muted);padding:6px 10px;
  border-radius:7px;font-weight:700}
.yadd:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body>
